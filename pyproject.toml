[project]
name = "k609-keyboard-control"
version = "0.13.2"
description = "Unofficial lighting, key remapping and macro tool compatible with the Redragon Horus SE K609"
requires-python = ">=3.10"
license = "MIT"
# PyGObject + GTK 4.6+ come from the system (or are bundled in the AppImage). No other dependencies.

[project.scripts]
k609-keyboard-control = "k609_control.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
